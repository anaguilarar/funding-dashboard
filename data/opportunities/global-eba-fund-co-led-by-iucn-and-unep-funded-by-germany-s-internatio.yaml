support_type: project_funding
eligible_applicants: NGOs, INGOs, IGOs, CBOs, Indigenous Peoples' Organisations, universities/academic
  institutions, research institutes/think tanks, private sector companies, and consortia. UNEP and IUCN
  offices not eligible; government entities may join consortia but cannot receive funds.
eligible_countries: Project is Global, Thematic, or otherwise targets only ODA-eligible countries.
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: IGOs and research institutes are explicitly listed as eligible; CIAT (international
  organization) or Bioversity International could lead or be co-applicant. Must build on existing EbA
  work.
lead_applicant_requirements: A clearly defined lead 'Applicant Organisation' that is the contract party;
  project must be built/based on existing work; at least three indicators from the Fund's Core Indicator
  Framework.
geographic_restrictions: Global/thematic or ODA-eligible countries only (Colombia, Central America, Africa,
  Asia ODA countries qualify).
consortium_required: optional
consortium_details: Consortia allowed with a defined lead applicant; co-applicant mandate required for
  partners.
cofunding_required: Not specified
cofunding_details: FAQ encourages seeking additional donors; no mandatory co-financing stated.
eligible_activities: 'Three priority topics: (I) Innovative Finance Solutions for EbA; (II) EbA for Human
  Development and Security (fragile/conflict-affected contexts); (III) Interlinkages for people-nature-climate-land
  synergies across the Rio Conventions. Focus on removing systemic barriers to scaling EbA.'
required_documents: Applicant Declaration; Co-applicant Mandate; Medium-Size Grants Application Form;
  Theory of Change, Logframe and Project Activities Form; Project Proposal Budget Template; Due Diligence
  and Financial Capacity Questionnaire.
application_procedure: Submit in English via the Fund's online platform ('All applications must be submitted
  on the online platform').
eligibility_assessment: confirmed_eligible
scientific_alignment: 3
scientific_alignment_rationale: EbA / landscape adaptation is core to the Multifunctional Landscapes area;
  EO/AI/crop modelling can support evidence and investment-readiness (e.g., spatial targeting of EbA,
  climate-risk layers for innovative finance), but methods are secondary to the scaling/finance framing.
strategic_relevance: 4
strategic_relevance_rationale: IUCN/UNEP/IKI-backed, ODA focus, matches Alliance landscapes & adaptation
  mission; 'interlinkages' topic fits agroforestry/land restoration portfolio.
technical_feasibility: 3
technical_feasibility_rationale: Feasible only if built on an existing Alliance EbA/landscape project;
  deadline in 6 days makes a new proposal very tight.
recommendation: Pursue only if a landscape/EbA team already has a near-ready concept building on existing
  work (e.g., Colombia/Central America agroforestry or watershed EbA); otherwise monitor for the next
  medium-size round. Not a staff-salary-confirmed scheme - check the budget template.
potential_partners: Alliance Multifunctional Landscapes team; national NGOs in ODA countries; IUCN regional
  offices as non-funded partners.
next_action: 'By 12 Nov: check with Alliance landscapes/adaptation leads whether an existing EbA project
  can be scaled; download budget template to confirm personnel cost rules; submit by 16 Nov 2026.'
