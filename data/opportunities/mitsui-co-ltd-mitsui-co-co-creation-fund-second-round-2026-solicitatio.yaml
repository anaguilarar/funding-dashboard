international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: No nationality/country limit stated and any juridical-person organization appears
  eligible, so CIAT/Bioversity could plausibly lead, BUT a Mitsui & Co. officer or employee must recommend
  the project and act as 'Co-Creator'. Without an internal Mitsui sponsor the application cannot proceed.
lead_applicant_requirements: Applicant must be the main executing entity; project must be recommended
  by a Mitsui officer/employee who agrees to act as Co-Creator.
geographic_restrictions: None stated.
consortium_required: 'no'
consortium_details: Co-creation with a Mitsui employee required (not a consortium).
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: 'Social-issue projects of any type; excluded: for-profit, political or religious
  activities, projects funding Mitsui''s own investments, projects where the applicant is not the main
  executor.'
required_documents: Not specified (initial contact via website inquiry form).
application_procedure: Contact Mitsui through the website inquiry form before the deadline; Fund Team
  preliminary review, internal interview/review board, then external reviewers; rounds close end of May
  and end of November; notifications in September and the following March.
eligibility_assessment: potentially_eligible
scientific_alignment: 2
scientific_alignment_rationale: Open thematically (any social issue); a climate-resilient agri-food /
  digital advisory project could fit, but there is no explicit focus on EO/AI/crop modelling.
strategic_relevance: 3
strategic_relevance_rationale: Three-year grants of up to JPY 100M could fund staff and multi-year work
  in Asia/LAC/Africa; Mitsui has a large agri-food and Japan/Asia footprint and the researcher has Japan
  ties.
technical_feasibility: 3
technical_feasibility_rationale: Team could deliver an applied project; main barrier is securing a Mitsui
  internal Co-Creator.
recommendation: Worth pursuing only if a Mitsui & Co. contact (e.g., agri/food business unit, Mitsui offices
  in Colombia/Kenya/Viet Nam/Japan) can be found to sponsor. The 30 Nov 2026 round is very tight; the
  realistic target is the end-May 2027 round.
potential_partners: Mitsui & Co. agri-food / nutrition business units; Japanese partners (JIRCAS, Univ.
  of Tokyo).
next_action: Submit an inquiry via the Mitsui sustainability contact form asking whether externally initiated
  projects can be matched to a Co-Creator and whether personnel costs are eligible; aim for the May 2027
  round.
