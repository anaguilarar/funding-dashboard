funding_text: 拟资助能力培育项目 23 项左右，资助强度不超过 60 万元/项（直接费用）；重点项目 15 项左右，资助强度不超过 200 万元/项 (about 23 capacity-building
  projects up to 600k RMB; about 15 key projects up to 2M RMB; youth exchange and seminar projects up
  to 300k RMB). Chinese side only.
duration: 3 years (2027-2029) for research projects
duration_months_max: 36
covers_staff_costs: Not specified
support_type: project_funding
eligible_applicants: 'Chinese PI (senior title, NSFC 3-year project PI). Foreign partner: "外方合作者应在境外从事科学研究，具有所在国（或所在地）相当于副教授以上的专业技术职务（职称），并独立主持实验室或重要的研究项目"
  (foreign partner must work abroad, hold associate-professor-equivalent title, and independently lead
  a lab or major project).'
eligible_countries: Any country for foreign partner; focus on Belt and Road partner countries and typical
  regions worldwide.
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: Senior Alliance scientist could be the foreign collaborator of a Chinese PI.
  No CGIAR-specific window. Chinese lead required.
lead_applicant_requirements: 中方申请人应具有高级专业技术职务（职称），应作为负责人正在承担或承担过 3 年期（含）以上国家自然科学基金项目 (Chinese applicant
  must hold a senior title and be/have been PI of a 3+ year NSFC project).
geographic_restrictions: Chinese mainland lead; '重点聚焦“一带一路”共建国家及全球典型区域' (focus on Belt and Road countries
  and typical global regions).
consortium_required: 'yes'
consortium_details: Chinese PI + foreign collaborator; joint English application signed by the foreign
  partner.
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: 'Direction (五) 气候变化下的农产品安全: ''构建气候适配型粮食稳产预测与风险预警体系，研发推广跨境协同的气候智慧型农业方案'' (climate-adapted
  grain yield prediction and risk early-warning systems; cross-border climate-smart agriculture). Integration
  of observation, simulation, big data and AI is encouraged.'
required_documents: Chinese application; English application (Appendix 1/2) signed by the foreign partner;
  cooperation agreement after approval.
application_procedure: Chinese PI via https://grants.nsfc.gov.cn (组织间合作研究 > SDIC).
eligibility_assessment: potentially_eligible
scientific_alignment: 5
scientific_alignment_rationale: Yield forecasting/early warning under climate change using observation,
  modelling, big data and AI is exactly the researcher's profile.
strategic_relevance: 4
strategic_relevance_rationale: Builds China partnerships on climate-ag forecasting; Belt and Road framing
  fits less with LAC but global typical regions allowed.
technical_feasibility: 4
technical_feasibility_rationale: Feasible as foreign collaborator, but the foreign partner must hold associate-professor-equivalent
  rank and lead a lab or major project, so a senior Alliance scientist may need to be the named partner.
recommendation: Closed for 2026; watch for a 2027 Guideline Two. Pair with a Chinese crop-modelling/RS
  group.
potential_partners: AIRCAS, CAAS-IARRP, China Agricultural University, Nanjing Agricultural University.
next_action: Monitor NSFC guide list from ~March 2027; secure Chinese PI.
