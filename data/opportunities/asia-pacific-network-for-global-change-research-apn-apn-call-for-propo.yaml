eligible_applicants: '''Members of non-profit making institutions based in APN member and/or approved
  countries can submit proposals to APN.'' Independent researchers, consultants and private-sector employees
  cannot submit. Early-career-led proposals prioritized.'
eligible_countries: 'Members: Australia, Bangladesh, Bhutan, Cambodia, China, Fiji, India, Indonesia,
  Japan, Lao PDR, Malaysia, Mongolia, Nepal, New Zealand, Pakistan, Philippines, Republic of Korea, Russian
  Federation, Sri Lanka, Thailand, USA, Viet Nam. Approved: Maldives, Myanmar, Pacific Island Countries,
  Singapore. Colombia and Italy are not members.'
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: 'Lead must be a non-profit institution based in a member/approved country. Alliance
  Asia offices (e.g., Viet Nam) might qualify but the FAQ does not address international organizations.
  Safer route: national partner leads, Alliance Asia staff as collaborators. Collaborators from non-member
  countries ''strictly cannot seek funds from APN''.'
lead_applicant_requirements: Non-profit institution in an APN member/approved country; CRRP must engage
  at least 3 member/approved countries (developed-country leads must include >=2 developing-country institutions).
geographic_restrictions: Asia-Pacific member/approved countries; priority topics set by subregional committees.
consortium_required: 'yes'
consortium_details: 'CRRP: >=3 member/approved countries; CAPaBLE: >=1.'
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: Global change research and capacity development in APN thematic areas incl. 'Climate',
  'Food, water and energy', 'Biodiversity and ecosystems', 'Risk and resilience'.
required_documents: Stage 1 summary proposal via APNIS; full proposal by invitation (previous cycle).
application_procedure: Two-stage via APNIS online system; applicants may submit to only one programme.
eligibility_assessment: potentially_eligible
scientific_alignment: 3
scientific_alignment_rationale: Climate/food-system topics fit; EO/crop-modelling methods acceptable but
  subregional priority topics not yet known.
strategic_relevance: 3
strategic_relevance_rationale: Relevant to Alliance Asia hub (SE Asia rice systems, matching the researcher's
  rice-phenology background); small grants.
technical_feasibility: 3
technical_feasibility_rationale: Feasible only with Asia-based colleagues/partners as leads; researcher
  is based in Colombia.
recommendation: Monitor; pursue only via Alliance Asia colleagues or a national partner in Viet Nam/Lao
  PDR/Cambodia (e.g., Sentinel-1 rice phenology/yield forecasting). Low funding size.
potential_partners: Alliance Asia office (Hanoi), Vietnam Academy of Agricultural Sciences, Vietnam National
  University of Agriculture, IRRI (CGIAR), regional universities.
next_action: Check the APN calls page in early-mid November 2026 for the new call and subregional priority
  topics; consult the Alliance Asia team about which entity would lead.
