status: needs_reverification
status_basis: official
published_date: '2026-11-02'
deadline: 2026-11-30T23:59
deadline_timezone: JST
deadline_text: 'Stage 1: Submission of Summary Proposal (online via APNIS): Monday, 30 November 2026,
  23:59 Japan Standard Time. Stage 2 (full proposals, by invitation only): 29 March 2027, 23:59 JST.'
funding_amount_min: null
funding_amount_max: 45000
currency: USD
funding_text: 'Call page: "A limited amount of funding is available to support CRRP and CAPaBLE activities".
  FAQ: "APN provides an annual budget limit of USD 45,000 for projects under the Collaborative Regional
  Research Programme (CRRP)" and "USD 40,000 for projects under the Scientific Capacity Development Programme
  (CAPaBLE)." No administrative overhead allowed.'
duration: CRRP typically 2 years (maximum 3, rarely funded); CAPaBLE typically 1 year (maximum 2). Funding
  and implementation from 1 October 2027.
duration_months_max: 36
covers_staff_costs: partial
support_type: project_funding
eligible_applicants: Researchers, academics and practitioners working in nonprofit or government institutions
  based in APN member or approved countries. Collaborators from non-member/non-approved countries cannot
  receive APN funding but may participate as resource persons or experts.
eligible_countries: 'APN member and approved countries in the Asia-Pacific (sub-regions: Pacific, South
  Asia, Southeast Asia, Temperate East Asia). See the APN member-country list and the Guide for Proponents
  on APNIS.'
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: 'International organisations are not addressed explicitly. Eligibility depends
  on where the institution is based: an Alliance office in an APN member country (e.g., Viet Nam, a Southeast
  Asia member) might qualify as a nonprofit institution there, but this was not confirmed. Safer route:
  an Alliance researcher in Asia leads or co-leads with national partners (universities, NARS) from at
  least two developing member countries; staff based in non-member countries can only take part as unfunded
  resource persons.'
lead_applicant_requirements: Project leader affiliated with a nonprofit or government institution in an
  APN member or approved country. CRRP proposals from developed-country proponents need at least two developing
  APN member or approved countries as collaborators. One-country summary proposals are accepted only from
  developing countries and only under CAPaBLE.
geographic_restrictions: Asia-Pacific APN member and approved countries only; proposals must address one
  or more sub-regional priority topics.
consortium_required: optional
consortium_details: CRRP is regional and multi-country (APN does not fund one-country CRRP research).
  CAPaBLE accepts one-country proposals from developing countries. Codesign with stakeholders is mandatory.
cofunding_required: Not specified
cofunding_details: Not specified on the call page or FAQ.
eligible_activities: 'Collaborative regional research (CRRP) and scientific capacity development (CAPaBLE)
  on sub-regional priority topics. Southeast Asia: climate resilience and loss and damage; digital technologies
  and AI for Earth observation; One Health; chemicals, waste, pollution and circular economy. South Asia:
  climate resilience; nature-based solutions; digital technologies and AI for Earth observation; food,
  water, energy and human security; governance and knowledge systems. Similar lists for the Pacific and
  Temperate East Asia.'
required_documents: 'Stage 1: Summary Proposal submitted online via APNIS following the CRRP and CAPaBLE
  Guide for Proponents. Stage 2: full proposal (by invitation only).'
application_procedure: Register on APNIS (https://www.apn-gcr.org/apnis/) and submit the Stage 1 Summary
  Proposal by 30 Nov 2026, 23:59 JST. Shortlisted proponents are invited to submit a full proposal by
  29 Mar 2027. Funding starts 1 Oct 2027.
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: Explicit priority topic 'digital technologies and AI for Earth observation'
  (South Asia, Southeast Asia, Temperate East Asia), plus climate resilience and food security, matches
  the EO/AI/climate-agriculture profile directly.
strategic_relevance: 3
strategic_relevance_rationale: Good fit for the Alliance Asia hub and partnerships with Southeast Asian
  NARS, but grants are small (up to USD 45k per year).
technical_feasibility: 4
technical_feasibility_rationale: A summary proposal on EO/AI for crop monitoring or climate resilience
  in Southeast Asia is within existing capacity. Main constraint is the 4-week window for Stage 1.
recommendation: Apply with a short Stage 1 summary proposal (CRRP) on AI and Earth observation for rice/crop
  climate resilience in Southeast Asia. Have an Alliance Asia (Viet Nam) researcher or a national partner
  lead, with at least two developing member countries. Small budget and only partial salary support, so
  treat it as seed and networking funding.
potential_partners: Vietnam Academy of Agricultural Sciences (VAAS), Lao and Cambodian NARS, Philippine
  and Thai universities, IRRI, University of Tokyo contacts (Temperate East Asia link).
next_action: Confirm with the APN secretariat (advisory.service@apn-gcr.org) whether the Alliance's Viet
  Nam office counts as an eligible institution in a member country. Draft the summary proposal on APNIS
  before 30 Nov 2026.
