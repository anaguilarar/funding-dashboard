scientific_alignment: 4
scientific_alignment_rationale: Multi-location variety trials + climate modelling are a natural fit for
  UAV/RS phenotyping, ML and crop/climate suitability modelling; the June 2026 initiative itself is genomics-focused
  and does not fund phenotyping.
strategic_relevance: 4
strategic_relevance_rationale: Existing Alliance-WCR relationship (CafeClima), Colombia/LAC coffee focus,
  corporate co-funding pipeline (FFAR + member companies).
technical_feasibility: 4
technical_feasibility_rationale: High-throughput phenotyping of Innovea trials and climate-informed variety
  recommendations are within team capabilities.
recommendation: 'Strategic monitoring (corporate-funded consortium): propose a remote-sensing/UAV phenotyping
  + climate-modelling add-on to WCR''s Innovea trials (incl. Cenicafe), building on CafeClima. Funding
  would likely come from WCR member companies or FFAR-matched grants.'
potential_partners: WCR, Cenicafe (FNC Colombia), Taylors of Harrogate, Coffee Circle, Alliance coffee
  team (Eric Rahn)
next_action: Coordinate with Alliance coffee researchers (Eric Rahn) and contact the WCR science team
  to explore a phenotyping/climate-analytics workstream for the Innovea network; watch WCR news for new
  co-funded initiatives.
