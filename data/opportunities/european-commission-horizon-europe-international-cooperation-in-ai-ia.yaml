status: upcoming
status_basis: official
published_date: Not specified
deadline: 2027-03-18T17:00
deadline_timezone: CET/CEST (Brussels local time, 17:00)
deadline_text: 'Portal: planned opening 2026-11-17; single-stage deadline 2027-03-18.'
funding_amount_min: 1500000
funding_amount_max: 1500000
currency: EUR
funding_text: Innovation Action (lump sum); topic budget EUR 3 million, 2 grants of EUR 1.5 million each.
duration: Not specified
duration_months_max: null
covers_staff_costs: 'yes'
support_type: project_funding
eligible_applicants: Standard Horizon Europe consortium; African LMIC partners eligible for funding per
  General Annex B.
eligible_countries: EU MS/AC + LMICs (General Annex B list, incl. Kenya, Ghana, Rwanda, etc.); scope focuses
  on African countries.
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: 'No IO clause in topic conditions: Bioversity/CIAT funded only if deemed essential,
  otherwise associated partners. African national partners (universities, innovation hubs) can be funded
  beneficiaries. IA funding rate up to 100% for non-profits.'
lead_applicant_requirements: Min. 3 independent entities from 3 different MS/AC (one in a MS).
geographic_restrictions: Living labs/deployment in low- and middle-income countries, focus on Africa.
consortium_required: 'yes'
consortium_details: Should link to AI for Public Good, GenAI for Africa, Digital for Development Hub,
  Global Gateway; living labs in local innovation hubs.
cofunding_required: 'no'
cofunding_details: 'IA: 70% (100% for non-profit legal entities).'
eligible_activities: TRL 5->7 prototyping, testing, validation and demonstration of locally adapted AI
  solutions trained on local data; living labs; talent pipelines; areas include 'climate and agriculture,
  biodiversity'.
required_documents: Part A administrative forms (in submission system) + Part B technical description
  per template; detailed lump-sum budget table where lump sum applies; ethics self-assessment. See General
  Annexes A and E.
application_procedure: Electronic submission by the coordinator via the EU Funding & Tenders Portal; all
  participants need a validated PIC.
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: AI tools adapted with local data for agriculture/climate in Africa match
  the digital-advisory and geospatial-AI profile.
strategic_relevance: 3
strategic_relevance_rationale: Small (EUR 1.5M) but directly on AI-for-agriculture in Africa; good for
  Alliance Africa hubs with African partners as funded beneficiaries.
technical_feasibility: 3
technical_feasibility_rationale: Alliance has relevant AI/advisory tools at TRL 5+; funding route for
  Alliance staff uncertain.
recommendation: Pursue as partner with an EU coordinator and African innovation hubs; clarify early with
  the EC whether Bioversity can be a funded beneficiary as 'essential'.
potential_partners: EU AI research groups in AI-for-Public-Good/GenAI4Africa projects; African innovation
  hubs (e.g., in Kenya, Rwanda, Ghana); Alliance Africa hub.
next_action: Read full topic when it opens 17 Nov 2026; identify EU coordinator and African hubs by Jan
  2027.
