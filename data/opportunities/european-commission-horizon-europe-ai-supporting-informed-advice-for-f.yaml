eligible_applicants: Consortia per General Annex B; multi-actor approach mandatory; entities controlled
  by China excluded (critical technology restriction).
eligible_countries: EU MS and Associated Countries (+ LMIC list per General Annex B); no IO exception
  in topic.
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: 'Horizon Europe General Annex B (WP 2026-2027): Colombia, Kenya and most African/LAC
  countries are on the list of low- and middle-income countries automatically eligible for funding, but
  the Alliance entities are international organisations, to which the IO rule applies: IOs are funded
  only when the topic says so or when deemed essential. Where the topic does not open funding to IOs,
  Bioversity International/CIAT can join as an associated partner (unfunded) or argue ''essential participation''
  (risky). Bioversity International is headquartered in Italy (an EU Member State), so it fits the ''IO
  with headquarters in a Member State'' clause; CIAT (HQ Colombia) does not. Confirm the Alliance''s PIC/legal
  status validation (IO vs. national entity) with the Alliance grants office. This topic has no IO exception
  and targets EU agriculture/forestry, so the Alliance is realistically an associated partner (e.g., contributing
  open AI advisory models/datasets) rather than a funded beneficiary.'
lead_applicant_requirements: Standard HE rules (3 independent entities from 3 MS/AC).
geographic_restrictions: Focus on EU agriculture and forestry sectors; must use Copernicus and/or Galileo
  if satellite EO is used.
consortium_required: 'yes'
consortium_details: Multi-actor approach (advisors, farmers, foresters). JRC may participate.
cofunding_required: 'no'
cofunding_details: RIA/CSA funded at 100% of eligible costs (lump sum); not-for-profit legal entities
  get 100% in IAs too. See General Annex G.
eligible_activities: Develop, test, validate and pilot AI-based advisory solutions using multimodal inputs
  (text, images, audio, video), standardised datasets and in-situ data; build advisor/farmer AI skills.
required_documents: Proposal Part A (admin forms via Funding & Tenders Portal) and Part B (technical description
  per template); ethics self-assessment; lump-sum budget table where lump sum applies. See General Annexes
  A and E.
application_procedure: Electronic submission through the EU Funding & Tenders Portal by the coordinator;
  all participants need a validated PIC.
eligibility_assessment: potentially_eligible
scientific_alignment: 5
scientific_alignment_rationale: AI/LLM-based digital advisory with EO and in-situ data is a core interest
  of the researcher.
strategic_relevance: 2
strategic_relevance_rationale: EU-focused competitiveness topic; limited fit to Alliance geographies;
  IO funding not provided.
technical_feasibility: 4
technical_feasibility_rationale: Alliance has digital advisory experience (e.g., site-specific advisories),
  but TRL 8 in EU farms requires EU partners.
recommendation: Consider only as associated/knowledge partner with an EU consortium bringing Global-South
  advisory experience; low funding likelihood for the Alliance.
potential_partners: EU AKIS actors, WUR, Fraunhofer, agri-tech SMEs, EU farm advisory networks.
next_action: Check with Bioversity grants office whether participation could be funded via 'essential
  participation'; otherwise offer associated-partner role to EU contacts.
