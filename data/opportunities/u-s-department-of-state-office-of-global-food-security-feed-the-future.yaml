status: monitoring
status_basis: official
published_date: '2026-03-10'
deadline: null
deadline_timezone: Not specified
deadline_text: 'Prime competition closed: "Concept Note Application deadline: April 9, 2026". Awards announced
  October 15, 2026. No deadline for partner/sub-recipient engagement has been published; any sub-award
  calls would be issued by the individual labs.'
funding_amount_min: 20000000
funding_amount_max: 40000000
currency: USD
funding_text: '"Individual awards may range from a minimum of $20 million to a maximum of $40 million
  (approximately) over the life of the award." "$64 million total in FY 2026 (with outyear funding subject
  to the availability of funds)". Amounts are per lab (prime award), not per sub-recipient; sub-award
  sizes Not specified.'
duration: '"Length of performance period: Up to 60 months"; "Anticipated project start date No later than
  September 30, 2026".'
duration_months_max: 60
covers_staff_costs: Not specified
support_type: project_funding
eligible_applicants: 'Prime: "Applications must only be submitted by eligible U.S. colleges and universities
  as defined under Section 296(d) of Title XII of the Foreign Assistance Act". Partners: "All types of
  U.S. and non-U.S. entities are eligible as collaborating partners (i.e. sub-recipients or contractors
  at various tiers)".'
eligible_countries: Activities in low- and middle-income countries (World Bank classification) aligned
  with U.S. foreign-policy goals; specific lab countries Not specified in the release.
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: 'LEAD: no (prime restricted to U.S. Title XII universities; prime competition
  closed). FUNDED PARTNER: yes - the SOI states non-U.S. entities are eligible as sub-recipients or contractors
  ''at various tiers'', provided they are not excluded in SAM.gov, and it explicitly describes the labs
  as collaborating with ''national and international research centers''. CIAT/Bioversity can therefore
  receive sub-awards from the lead universities. Most relevant labs for the Alliance: Coffee and Cacao
  (U. Hawaii; LAC relevance), Sustainable Intensification of Targeted Agricultural Systems - SITAS (Kansas
  State), Cereals (Kansas State), Fertilizer and Soil Health (Auburn), High Value Crops - SAFE (U. Florida).
  Whether a given lab already includes CGIAR partners is Not specified.'
lead_applicant_requirements: U.S. Title XII-eligible college/university (land-grant, sea-grant, or other
  U.S. universities with agricultural research/extension capacity).
geographic_restrictions: LMICs; geographic targeting must align with U.S. National Security Strategy and
  State Department Agency Strategic Plan 2026-2030.
consortium_required: 'yes'
consortium_details: 'Labs are university-led multi-partner programs: "multiple partners, principal of
  which are U.S. universities, working in collaboration with scientists in developing country universities,
  national and international research centers, the private sector, and non-governmental organizations".
  No required percentage of funding for sub-awards (Q&A Answer 25).'
cofunding_required: 'no'
cofunding_details: '"Cost sharing or matching is not required."'
eligible_activities: 'Objective 1: productivity, sustainable intensification, soil/water management, resilience
  to weather shocks, pests/pathogens, breeding, livestock/animal health. Objective 2: nutrition, food
  systems, food safety. Cross-cutting: "Use of a range of innovations and advances, including Artificial
  Intelligence and digital solutions"; "Coordination and collaboration with the global agricultural research
  community, including global research institutions".'
required_documents: 'For partners: Not specified (determined by each lead university''s sub-award process;
  must be registered/not excluded in SAM.gov).'
application_procedure: No open application for partners. Engage directly with the Management Entity (lead
  university) of each lab; sub-awards are made under 2 CFR 200.331/200.318-200.320 procedures per Q&A
  Answer 25.
eligibility_assessment: confirmed_ineligible
scientific_alignment: 3
scientific_alignment_rationale: Climate-resilience, sustainable intensification and AI/digital decision
  support for smallholders are explicit themes, but the labs are crop/commodity-centred; RS/crop-modelling
  would be a service component within lab research portfolios.
strategic_relevance: 5
strategic_relevance_rationale: Main surviving U.S. government channel for international agricultural research
  after USAID's dismantling; up to 5-year programmes; Coffee & Cacao lab directly relevant to Colombia/LAC;
  State Dept has also directly funded a CGIAR center (CIMMYT, USD 40M, Feb 2026).
technical_feasibility: 4
technical_feasibility_rationale: Alliance has deep coffee/cacao, soils, digital agriculture and EO capacity
  in LAC, Africa and Asia; feasibility depends on lab partner selection.
recommendation: Partner-only (ineligible as lead). High priority to contact lab directors now while awards
  are starting up (start no later than 30 Sep 2026; 60-month horizon), offering EO/crop-model/digital
  advisory services and LAC field networks, especially to the Coffee & Cacao (U. Hawaii) and SITAS/Cereals
  (Kansas State) labs. Coordinate with Alliance/CGIAR partnership office.
potential_partners: University of Hawaii (Coffee and Cacao); Kansas State University (Cereals; SITAS);
  Auburn University (Fertilizer and Soil Health); University of Florida (High Value Crops - SAFE); University
  of Georgia (Peanut); Washington State (Animal Health); Mississippi State (Fish).
next_action: Identify Management Entity directors of the Coffee & Cacao, SITAS and Cereals labs (university
  websites) and send a partnership note; confirm CIAT/Bioversity active SAM.gov registration.
evidence:
  deadline_quote: 'Concept Note Application deadline: April 9, 2026'
  eligibility_quote: All types of U.S. and non-U.S. entities are eligible as collaborating partners (i.e.
    sub-recipients or contractors at various tiers) of the applicant, provided that they are not excluded
    from U.S. Government acquisition and assistance awards (this may be verified through SAM.gov).
  status_quote: October 15, 2026 Today, the State Department announced eight Feed the Future Innovation
    Labs in partnership with U.S. Land Grant Universities from around the country.
  staff_costs_quote: 'Not specified for sub-recipients; Q&A Answer 14: "Information about allowable indirect
    costs can be found in 2 CFR 200.414."'
