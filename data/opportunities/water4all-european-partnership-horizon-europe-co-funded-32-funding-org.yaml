status: open
status_basis: official
published_date: '2026-09-08'
deadline: 2026-11-10T15:00
deadline_timezone: CET
deadline_text: 'Pre-proposal deadline: 10 November 2026, 15:00 CET; full proposal deadline: 6 April 2027,
  15:00 CEST.'
funding_amount_min: null
funding_amount_max: null
currency: EUR
funding_text: Approximately EUR 34 million total call budget, provided by national/regional funders (each
  partner funded by its own national FPO under national rules).
duration: 36 months
duration_months_max: 36
covers_staff_costs: Not specified
support_type: project_funding
eligible_applicants: Partners eligible under participating national/regional funders' rules; maximum seven
  partners including one self-funded partner.
eligible_countries: Funders from Austria, Belgium, Brazil (CONFAP), Czechia, Denmark, Estonia, Finland,
  France, Germany, Greece, Hungary, Ireland, Israel, Latvia, Lithuania, Luxembourg, Malta, Moldova, Netherlands,
  Norway, Poland, Romania, Slovakia, South Africa (DSTI), Spain, Sweden, Tunisia, Türkiye and others (see
  Call Announcement Table 1). Italy and Colombia are not funding countries.
international_orgs_eligible: unclear
cgiar_eligible: 'yes'
cgiar_eligibility_notes: No Italian or Colombian funder participates, so the Alliance cannot request funding;
  it can join only as the single 'self-funded partner' (cannot coordinate, must provide a commitment letter,
  needs a PIC).
lead_applicant_requirements: Coordinator must be an eligible funded partner; self-funded partners cannot
  coordinate.
geographic_restrictions: At least three eligible funded partners from three different countries; at least
  two independent legal entities from two different EU MS or HE associated countries as funding recipients.
consortium_required: 'yes'
consortium_details: Max 7 partners incl. 1 self-funded; no partner >50% person-months; partners from same
  country together <=50% person-months.
cofunding_required: Not specified
cofunding_details: Self-funded partner must cover its own costs.
eligible_activities: 'Topics: (1) integrated monitoring and assessment; (2) nature-based approaches for
  resilient water management; (3) smart, secure and adaptive water infrastructures; (4) resilient water
  systems through governance. Excludes extreme events and circularity.'
required_documents: Pre-proposal (template provided); full proposal; letter of commitment for self-funded
  partner; national documents per Annex A/National Regulations.
application_procedure: Two-stage electronic submission via the Water4All submission system by the coordinator.
eligibility_assessment: potentially_eligible
scientific_alignment: 3
scientific_alignment_rationale: Topic 1 (integrated monitoring, EO for agricultural water) fits RS skills,
  but water management is not the core topic.
strategic_relevance: 2
strategic_relevance_rationale: No funding for the Alliance; useful only to support partners (e.g., Brazil
  CONFAP, South Africa DSTI, Tunisia).
technical_feasibility: 3
technical_feasibility_rationale: Feasible as an in-kind EO/data partner; very short timeline.
recommendation: Low priority; join only if an existing partner (e.g., a Brazilian or South African group)
  invites the Alliance as self-funded partner before 10 Nov 2026.
potential_partners: Brazilian state research foundations' grantees (CONFAP), South African universities
  (DSTI), European water institutes (Deltares, IHE Delft via NWO).
next_action: Only act if approached; otherwise monitor the next Water4All JTC.
evidence:
