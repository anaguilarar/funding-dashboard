title: Kunming Biodiversity Fund (KBF) 2026 Call for Proposals - Stage 2
funder: Kunming Biodiversity Fund (initiated and financed by the Government of China; Secretariat hosted
  with UNEP)
funder_type: multilateral
program: Kunming Biodiversity Fund - 2026 Full Size Project call
opportunity_type: grant
themes:
