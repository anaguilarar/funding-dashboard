cofunding_details: RIA 100% funding rate (Horizon Europe standard)
eligible_activities: Develop scalable cost-effective biodiversity monitoring integrating technologies;
  demonstration cases; automated and real-time monitoring frameworks supported by AI; compare approaches;
  DNA-based species identification; Copernicus use mandatory if satellite EO used
required_documents: Horizon Europe Part A and Part B via F&T Submission System
application_procedure: Single-stage submission via EU Funding & Tenders Portal (submission session open
  since 13 Oct 2026)
eligibility_assessment: potentially_eligible
scientific_alignment: 3
scientific_alignment_rationale: AI/automated and remote-sensing-supported monitoring matches skills; but
  focus is in-situ, DNA and pollinator/soil/freshwater biodiversity in EU legal schemes.
strategic_relevance: 2
strategic_relevance_rationale: EU-internal policy focus; limited LAC/Africa/Asia relevance; useful for
  Bioversity's agrobiodiversity monitoring portfolio.
technical_feasibility: 3
technical_feasibility_rationale: Alliance could contribute AI/EO data fusion; would rely on European partners
  for field schemes.
recommendation: Low-medium priority; join only if an EU consortium needs an AI/EO data-integration partner
  (e.g., Area A pollinator habitat mapping). Deadline is close (14 Jan 2027).
potential_partners: Biodiversa+ members, JRC-linked institutes, UFZ, CREA (Italy), Naturalis
next_action: Check F&T partner search for HORIZON-NATURE-2027-02-05 consortia seeking AI/EO partners before
