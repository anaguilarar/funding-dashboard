title: Wellcome Discovery Awards (team awards up to 8 years; rolling) - location rules change 29 Oct 2026
funder: Wellcome
funder_type: foundation
program: Discovery Research - Wellcome Discovery Awards
opportunity_type: grant
themes:
- climate_adaptation
