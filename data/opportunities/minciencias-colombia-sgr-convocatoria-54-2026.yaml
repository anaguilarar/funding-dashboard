status: open
status_basis: official
published_date: '2026-10-23'
deadline: 2026-11-13T16:00
deadline_timezone: COT (UTC-5)
deadline_text: 'Cierre: viernes 13 noviembre 2026 04:00 pm'
funding_amount_min: null
funding_amount_max: 17177626246
currency: COP
funding_text: COP $927.591.817.322 total, distributed equally among the six SGR regions (COP $154.598.636.220
  per region); 'El valor máximo por proyecto con cargo al SGR es de ... ($17.177.626.246)'; approx. 54
  projects.
duration: Hasta cuarenta y ocho (48) meses, incluidos el alistamiento y el cierre
duration_months_max: 48
covers_staff_costs: partial
support_type: project_funding
eligible_applicants: 'Alliances of at least four distinct national legal entities (by NIT): an IES (Ley
  30/1992), another SNCTI entity (IES or Minciencias-recognised actor), a territorial entity of the region,
  and a user/adopter (producer org, company, civil society, ethnic organisation, etc.). Proponent must
  hold Minciencias SNCTI-actor recognition or meet CTeI track-record criteria (Decreto 1821/2020 art.
  1.2.3.2.2).'
eligible_countries: Colombia (project executed in at least 2 departments of the same SGR region)
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: International entities may join as allies through a 'Carta de intención de participación'
  (no NIT, do not sign the aval letter, not part of governance model) and must quantify an in-kind or
  cash contribution in COP; an international ally with quantified contribution earns +1 evaluation point.
  This route does not appear to give the international ally SGR funds. Whether CIAT (HQ in Palmira/Cali
  with Colombian registration) could participate as a national alliance member/proponent with NIT and
  SNCTI recognition was not verified.
lead_applicant_requirements: 'Proponent: SNCTI actor with current Minciencias recognition at closing date,
  or entity with CTeI activities meeting suitability/track-record criteria; an alliance member must have
  a research group category A1/A/B/C; at least 2 additional CTeI projects in last 10 years.'
geographic_restrictions: Projects executed in at least two departments of the same SGR region (Caribe,
  Pacífico, Centro Sur-Amazonía, Llanos, Centro Oriente, Eje Cafetero-Antioquia).
consortium_required: 'yes'
consortium_details: Minimum 4 national legal entities (IES + SNCTI entity + territorial entity + user/adopter);
  international allies optional via letter of intent.
cofunding_required: 'yes'
cofunding_details: Cada integrante de la alianza deberá aportar una contrapartida en efectivo o en especie,
  cuantificada en términos monetarios, independientemente del rol que desempeñe.
eligible_activities: 'Experimental/theoretical R&D, proofs of concept, equipment, platforms/software/ICT
  infrastructure, specialised R&D training, social appropriation, hiring of human talent (young researchers,
  master''s students, postdocs 24-36 months), national/international mobility, IP management, project
  administration. Thematic lines incl. Line 2 ''sistemas agroalimentarios inteligentes y regenerativos'',
  Line 9 ''agua, clima, riesgos y sostenibilidad territorial'', Line 5 ''territorios inteligentes: IA,
  conectividad, datos''.'
required_documents: Anexo 1 carta unificada de aval/compromiso/gobernanza; Anexo 2 documento técnico;
  Anexo 3 presupuesto; Anexo 5 proyectos CTeI; Anexo 12 vinculación de talento humano; letters of intent
  for international entities (Spanish or English); SIGP registration.
application_procedure: Submit through Minciencias SIGP platform before 13 Nov 2026 16:00; preliminary
  results 3 Dec 2026, final 10 Dec 2026; eligible projects enter bank for SGR approval.
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: Agrifood systems, water/climate risk and AI/data lines directly accommodate
  digital agriculture, crop modelling, EO-based climate risk work.
strategic_relevance: 4
strategic_relevance_rationale: Large SGR resources in CIAT's host country; 4-year projects; strengthens
  partnerships with Colombian universities, governorships and producer organisations.
technical_feasibility: 3
technical_feasibility_rationale: Technically deliverable, but very short window (11 days) and requires
  an already-formed national alliance; Alliance funding route uncertain.
recommendation: Only realistic as international ally (letter of intent + in-kind contribution) in a Colombian
  university-led alliance already preparing a proposal, or as national member if CIAT's NIT/SNCTI status
  allows. Worth quick outreach to university partners for Pacífico-region agrifood/climate projects.
potential_partners: Universidad Nacional de Colombia (Palmira), Universidad del Valle, Universidad del
  Cauca, AGROSAVIA, Gobernación del Valle/Cauca, producer associations (FEDEARROZ, Cenicaña).
next_action: 'Within days: confirm with Alliance legal/partnerships whether CIAT can participate as a
  national entity (NIT, SNCTI recognition); otherwise offer letters of intent with quantified in-kind
  contribution to partner alliances before 13 Nov 2026.'
evidence:
