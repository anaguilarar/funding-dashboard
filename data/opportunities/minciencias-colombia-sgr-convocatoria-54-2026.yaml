  status_quote: 'Apertura: viernes 23 octubre 2026 (page showed ''Cierra en: 11 día(s)'')'
  staff_costs_quote: Vinculación de talento humano, incluidos jóvenes investigadores e innovadores, estudiantes
    de maestría y doctores en estancia posdoctoral.
