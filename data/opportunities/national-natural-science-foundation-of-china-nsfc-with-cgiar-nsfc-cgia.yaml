status: monitoring
status_basis: speculative
published_date: '2026-03-31'
deadline: null
deadline_timezone: Beijing time (UTC+8)
deadline_text: '2026 round (closed): "The online application submission period is from March 31, 2026,
  to May 15, 2026, at 16:00 Beijing time." No 2027 round announced yet.'
funding_amount_min: null
funding_amount_max: 1800000
currency: CNY
funding_text: Up to 11 Key Projects and up to 10 Cooperative Exchange Projects ... For Key Projects, NSFC
  budget is up to 1.8 million RMB per project (direct costs) ... For Cooperative Exchange Projects, NSFC
  budget is up to 150,000 RMB per project. (NSFC funds the Chinese side.)
duration: Key Projects 3 years (2027-2029); Cooperative Exchange Projects 2 years (2027-2028)
duration_months_max: 36
covers_staff_costs: Not specified
support_type: project_funding
eligible_applicants: Chinese PI at an NSFC-registered host institution (senior title; current/previous
  PI of an NSFC project of 3+ years). Overseas PI must be a researcher from a CGIAR center.
eligible_countries: Chinese applicant in mainland China; overseas partner from any of the CGIAR research
  centers.
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: 'CIAT/Bioversity researcher can be the ''Oversea PI'' (the 2026 text: ''The oversea
  principal investigator should be a researcher from one of the 13 CGIAR research centers''). The Chinese
  partner submits; NSFC funds only the Chinese side, CGIAR side contribution Not specified.'
lead_applicant_requirements: '"The Chinese applicants should hold a senior professional technical position
  (or equivalent title) and, as principal investigator, be currently undertaking or have previously undertaken
  a NSFC research project with a duration of three years or longer." Max 2 Chinese cooperating institutions;
  one international cooperative research project per applicant per year.'
geographic_restrictions: Chinese lead in mainland China; research of relevance to China and other developing
  countries.
consortium_required: 'yes'
consortium_details: Chinese PI + CGIAR overseas PI; joint English application signed by the overseas PI;
  collaborative agreement after approval; title format 'CGIAR+specific project title'; Bilateral Strategic
  Alignment Statement (Appendix 5).
cofunding_required: Not specified
cofunding_details: NSFC budget covers the Chinese side only; CGIAR-side funding not described.
eligible_activities: 2026 directions included (B) Biodiversity and Climate Change (climate-resilient cropping
  systems; monitoring and decision assessment of agricultural biodiversity and resilience; restoration
  and carbon sequestration) and (C) Digital Agriculture and Precision Management (decision support systems
  for agrifood systems and dryland agriculture), plus germplasm, water/drylands, AI nutrition, livestock,
  fisheries.
required_documents: Chinese application in NSFC system; joint English application (Appendix 1) signed
  by overseas PI; Bilateral Strategic Alignment Statement (Appendix 5); collaborative agreement (Appendix
  2) after approval.
application_procedure: Chinese PI applies via https://grants.nsfc.gov.cn (Joint Research under Organizational
  Agreements > SDIC - Key Project). Application code 1 must be under C or G.
eligibility_assessment: potentially_eligible
scientific_alignment: 5
scientific_alignment_rationale: 2026 directions explicitly cover climate-resilient cropping, agrobiodiversity
  monitoring/assessment and digital decision support systems; direct fit for RS/AI/crop modelling.
strategic_relevance: 5
strategic_relevance_rationale: Dedicated CGIAR channel with China; Alliance named in earlier rounds; builds
  China-CGIAR partnerships.
technical_feasibility: 4
technical_feasibility_rationale: Feasible if a Chinese PI with an NSFC 3-year grant is identified early;
  proposal mostly written in English by both teams.
recommendation: Top-priority China channel but currently closed. The round timing moved from Aug-Sep (2025)
  to Mar-May (2026), so identify a Chinese co-PI (e.g., CAAS, China Agricultural University, AIRCAS) now
  and draft a concept to be ready for a likely early-2027 call.
potential_partners: CAAS Institute of Agricultural Resources and Regional Planning; Aerospace Information
  Research Institute (AIRCAS); China Agricultural University; Nanjing Agricultural University; CGIAR China
  Office.
next_action: Contact CGIAR China Office (ZHANG Xinxuan) and NSFC contact (WANG Lei, wanglei1@nsfc.gov.cn)
  to ask about the 2027 timeline; line up a Chinese PI by Jan 2027.
