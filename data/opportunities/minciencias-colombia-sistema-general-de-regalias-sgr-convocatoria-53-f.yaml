eligible_applicants: 'Proponente: IES, entidad del sector productivo u organización de sociedad civil
  domiciliada en Córdoba, con al menos dos proyectos CTeI ejecutados en los últimos 5 años.'
eligible_countries: Colombia (Departamento de Córdoba).
international_orgs_eligible: 'yes'
cgiar_eligible: unclear
cgiar_eligibility_notes: International entities can participate with a 'Carta entidad internacional' (no
  NIT, no carta aval Anexo 1), registered in SIGP/Anexo 2, not part of governance. CIAT cannot be proponent
  (must be domiciled in Córdoba).
lead_applicant_requirements: Domiciled in Córdoba; adequate DNP performance if measured in last 2 years;
  >=2 CTeI projects executed in last 5 years.
geographic_restrictions: Department of Córdoba.
consortium_required: 'yes'
consortium_details: 'Alliance: >=1 IES headquartered in Córdoba; 2 territorial entities in Córdoba (one
  must be the Departamento); 1 productive-sector actor; 1 civil-society organization in Córdoba; at least
  one member with research group A1/A/B.'
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: Agricultural, social and environmental reactivation; Reto 2 food sovereignty; Line
  4 CTeI solutions for socioeconomic reactivation and mitigating extreme climate conditions; projects
  must address >=2 thematic lines.
required_documents: Per TdR; Carta entidad internacional for international partners; Anexo 2 alliance
  registration; Anexo 4 territorial demands.
application_procedure: Online via SIGP (MinCiencias).
eligibility_assessment: potentially_eligible
scientific_alignment: 3
scientific_alignment_rationale: Climate extremes and food sovereignty in Córdoba fit climate-smart ag;
  RS/AI methods supportive rather than core.
strategic_relevance: 3
strategic_relevance_rationale: Colombian public funding, but CIAT is a non-governing ally; Córdoba is
  outside core HQ region.
technical_feasibility: 2
technical_feasibility_rationale: 9 days to deadline and complex 5-member local alliance must already be
  formed.
recommendation: Only pursue if an existing Córdoba consortium (e.g., Universidad de Córdoba, AGROSAVIA
  Turipaná) invites CIAT as international ally; otherwise skip.
potential_partners: Universidad de Córdoba, AGROSAVIA C.I. Turipaná, Gobernación de Córdoba, CVS, local
  producer associations.
next_action: Ask Universidad de Córdoba / AGROSAVIA contacts by 2026-10-16 whether a proposal needs an
  international EO/crop-modelling ally.
