eligible_countries: AF-eligible developing countries (endorsement by the country's AF Designated Authority).
international_orgs_eligible: unclear
cgiar_eligible: 'no'
cgiar_eligibility_notes: 'VERIFIED: no CGIAR center is an AF implementing entity. The 14 MIEs are ADB,
  World Bank, IDB, IFAD, UNDP, UNEP, WFP, UNESCO, EBRD, UN-Habitat, WMO, UNIDO, FAO, WHO; the 9 RIEs are
  BOAD, OSS, SPREP, CAF, CABEI, CDB, SPC, ICIMOD, CCCCC. The Alliance can take part only as executing
  entity/technical partner under an IE (e.g., FAO, IFAD, WFP, CAF, CABEI, or an accredited NIE).'
lead_applicant_requirements: Accredited NIE/RIE/MIE; endorsement letter from the country's AF Designated
  Authority.
geographic_restrictions: AF-eligible developing countries.
consortium_required: 'yes'
consortium_details: Implementing entity + Designated Authority endorsement + executing entities.
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: Concrete adaptation projects; innovation (accelerators, scaling adaptation innovations);
  locally led adaptation.
required_documents: AF project/programme proposal templates (Project Proposal Materials page).
application_procedure: The IE e-mails the proposal to submissions@adaptation-fund.org (rolling); reviewed
  by the AFB secretariat and PPRC.
eligibility_assessment: potentially_eligible
scientific_alignment: 3
scientific_alignment_rationale: Agricultural adaptation, early warning/climate services and innovation
  windows can embed EO, crop modelling and advisory tools, but AF funds implementation, not research.
strategic_relevance: 4
strategic_relevance_rationale: Strong LAC IE options (CAF, CABEI, IDB, FAO, WFP, IFAD) match the Alliance's
  LAC presence.
technical_feasibility: 3
technical_feasibility_rationale: Feasible as executing partner; depends on IE pipeline and DA endorsement.
recommendation: Approach FAO, WFP, IFAD or CABEI/CAF country teams with a climate-services/digital advisory
  component for upcoming AF proposals (including Large Innovation grants up to US$5m). Do not plan as
  lead.
potential_partners: FAO, WFP, IFAD, CAF, CABEI, WMO, national NIEs.
next_action: Review the AF 'Proposals Under Review' / 'Active Pipeline' pages for LAC countries and contact
  IEs with agri-climate projects in preparation.
