eligible_activities: 'Per program description: building publicly available cloud-hosted science tools,
  proof-of-concept/benchmarking of moving research workloads to the cloud, training the community via
  workshops/tutorials.'
required_documents: Not specified on the main page (see FAQs and Terms linked from it).
application_procedure: '''Apply now'' link on the official page; communication via aws-research-credit@amazon.com.'
eligibility_assessment: potentially_eligible
scientific_alignment: 3
scientific_alignment_rationale: Generic compute; relevant if building open cloud-hosted tools (e.g., crop
  model/advisory APIs, Sentinel data on AWS Open Data).
strategic_relevance: 3
strategic_relevance_rationale: Uncapped staff awards could support an open-source climate data infrastructure
  product.
technical_feasibility: 4
technical_feasibility_rationale: Team cloud-capable; slow review (90-120 days).
recommendation: Apply only if a concrete AWS-hosted public tool is planned (e.g., open crop-forecast service
  using Sentinel-2/ERA5 on AWS Open Data). Otherwise prioritize Google credits.
potential_partners: Optional university co-PI to remove accreditation ambiguity.
next_action: Read AWS research credits FAQ/T&Cs to confirm whether non-university research institutes
  qualify; scope a public tool proposal.
