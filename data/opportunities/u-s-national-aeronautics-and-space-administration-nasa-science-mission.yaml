scientific_alignment: 4
scientific_alignment_rationale: NASA biosphere/LCLUC and applied-science agriculture elements match RS/ML
  crop and land-use work directly, but exact ROSES-27 element content is unverified.
strategic_relevance: 3
strategic_relevance_rationale: Access to NASA science teams and data products; no funding for CIAT staff.
technical_feasibility: 4
technical_feasibility_rationale: Team can contribute in-kind EO/crop-model expertise and ground data.
recommendation: Do not count as staff funding. Monitor ROSES-27 release (by Jan 2027) and offer CIAT as
  an unfunded collaborator to U.S. PIs (e.g., NASA Harvest-linked universities) where it adds data access
  or co-authorship value.
potential_partners: U.S. universities active in NASA LCLUC/Harvest (e.g., University of Maryland), U.S.
  SERVIR science team members.
next_action: Watch the NASA ROSES page and NSPIRES in Dec 2026-Jan 2027; identify U.S. PIs planning biosphere/land-use
  proposals.
