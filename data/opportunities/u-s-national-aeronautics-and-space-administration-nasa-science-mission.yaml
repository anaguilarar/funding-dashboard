cgiar_eligibility_notes: 'FUNDED LEAD: no. FUNDED SUBAWARDEE: no (NASA funds only U.S. institutions; non-U.S.
  organizations participate on a no-exchange-of-funds basis per the NASA GCAM/Foreign PI instructions).
  UNFUNDED: CIAT could be a non-U.S. PI/Co-I on a no-exchange-of-funds basis, contributing in-kind (field
  data, crop models, LAC/Asia networks) to a U.S.-led proposal whose U.S. team is funded. Does NOT fund
  CIAT staff. Included only for strategic value (land-cover/land-use and agriculture EO science networks).'
