deadline_text: 'There are no deadlines for applications to this scheme. Applications can be submitted
  at any time. (Shortlisting three times a year: February, June, September.) Location eligibility changes
  from 29 October 2026 (lead in UK or LMICs in Africa, South Asia and South-East Asia only).'
