status: open
status_basis: official
published_date: '2026-05-28'
deadline: 2026-11-24T17:00
deadline_timezone: CET/CEST (Brussels local time, 17:00)
deadline_text: 'MSCA WP 2026-2027 call table: ''Opening: 28 May 2026 Deadline(s): 24 Nov 2026''. Portal:
  ''The submission session is now available for: HORIZON-MSCA-2026-DN-01-01''.'
funding_amount_min: null
funding_amount_max: null
currency: EUR
funding_text: 'Call budget EUR 628.03 million. Unit contributions per doctoral candidate per person-month:
  living allowance EUR 4,250 (x country correction coefficient; Italy 93.8%), mobility allowance EUR 710,
  family allowance EUR 660 (if applicable); institutional: research, training and networking EUR 1,600
  and management and indirect EUR 1,200. EU contribution capped at 540 person-months per network.'
duration: Action max 48 months (60 for Joint Doctorates); each fellowship 3-36 months (48 for Joint Doctorates).
duration_months_max: 48
covers_staff_costs: 'yes'
support_type: project_funding
eligible_applicants: Consortia of universities, research organisations, businesses and other socio-economic
  actors; at least three independent legal entities each in a different EU Member State/Associated Country,
  at least one in an EU Member State. Third-country organisations may participate (associated partners).
eligible_countries: 'Beneficiaries: EU Member States and Horizon Europe Associated Countries (plus LMIC
  list per General Annex B); associated partners worldwide.'
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: 'Bioversity International (international organisation headquartered in Italy)
  is deemed established in Italy for MSCA DN and, as an IO HQ''d in a Member State, is eligible for funding
  in ''Training and mobility'' actions (General Annex B). It can therefore be a funded beneficiary that
  recruits and hosts doctoral candidates (and could count as one of the three MS/AC entities). It is not
  a degree-awarding body, so a partner university must enrol the candidates. CIAT (IO HQ in Colombia)
  is not covered by the IO clause and would participate as an associated partner hosting secondments in
  Colombia/Kenya/etc. Max 40% of EU contribution to one IO. Mobility rule for candidates recruited by
  an IO: not more than 12 of the last 36 months in the same appointing organisation.'
lead_applicant_requirements: Coordinator must be a beneficiary established in an EU Member State/AC (Bioversity
  qualifies under the IO deeming rule). Each beneficiary must recruit at least one doctoral candidate.
geographic_restrictions: None on research location; secondments worldwide (incl. third countries) encouraged,
  up to half of the fellowship (except Joint/Industrial Doctorates).
consortium_required: 'yes'
consortium_details: '''Applications must be submitted by a consortium including at least three independent
  legal entities, each established in a different EU Member State or Horizon Europe Associated Country
  and with at least one of them established in an EU Member State.'' ''Not more than 40.0% of the EU contribution
  may be allocated to beneficiaries in the same country or to a single International European Research
  Organisation (IERO) or international organisation.'''
cofunding_required: 'no'
cofunding_details: 100% unit contributions (no co-funding).
eligible_activities: 'Doctoral training programmes: recruitment and research training of doctoral candidates,
  network-wide training, secondments, workshops; all research domains (bottom-up).'
required_documents: Part A administrative forms (in submission system) + Part B technical description
  per template; detailed lump-sum budget table where lump sum applies; ethics self-assessment. See General
  Annexes A and E.
application_procedure: Electronic submission by the coordinator via the EU Funding & Tenders Portal; all
  participants need a validated PIC.
eligibility_assessment: confirmed_eligible
scientific_alignment: 3
scientific_alignment_rationale: 'Bottom-up: a network on EO/AI for climate-resilient agriculture or crop
  modelling would fit; but it funds doctoral candidates, not the researcher''s own salary.'
strategic_relevance: 4
strategic_relevance_rationale: Multi-year (up to 48 months) salaried doctoral positions hosted at Bioversity
  Italy with secondments to Alliance hubs in LAC/Africa; strong EU partnership building.
technical_feasibility: 2
technical_feasibility_rationale: 'Deadline 24 Nov 2026 leaves ~4.5 weeks; only realistic by joining an
  existing consortium already drafting a proposal. Better target: DN 2027 (deadline 23 Nov 2027, opens
  26 May 2027).'
recommendation: Pursue only by joining an existing network as a beneficiary or associated partner before
  24 Nov 2026; otherwise plan now for HORIZON-MSCA-2027-DN-01 (opens 26 May 2027, deadline 23 Nov 2027,
  EUR 645.99 M) with Bioversity as recruiting beneficiary.
potential_partners: EU universities with digital-agriculture/EO doctoral schools (e.g., Wageningen, Univ.
  of Twente ITC, Univ. of Bonn, Sapienza/Tor Vergata, KU Leuven) plus agri-tech companies for Industrial
  Doctorates.
next_action: Contact Bioversity grants office to confirm PIC status/LEAR and willingness to recruit doctoral
  candidates; post a partner-search request on the portal for DN 2026/2027 networks on EO/AI for agriculture.
evidence:
  deadline_quote: 'Opening: 28 May 2026 Deadline(s): 24 Nov 2026'
  eligibility_quote: 'International organisations with headquarters in an EU Member State or Horizon Europe
    Associated Country will be deemed to be established in this Member State or Associated Country. |
    General Annex B: International organisations with headquarters in a Member State or Associated Country
    are eligible to receive funding for ''Training and mobility'' actions or when provided for in the
    specific call/topic conditions. Other international organisations are not eligible to receive funding,
    unless provided for in the specific call/topic conditions, or if their participation is considered
    essential for implementing the action by the granting authority.'
  status_quote: 'The submission session is now available for: HORIZON-MSCA-2026-DN-01-01'
  staff_costs_quote: The beneficiary must recruit each eligible doctoral candidate under an employment
    contract or equivalent direct contract ... with full social security coverage ... The living allowance
    is a gross amount, including compulsory deductions under national law, such as employer and employee
    social security contributions and direct taxes.
