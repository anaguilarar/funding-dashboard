id: minciencias-colombia-sgr-convocatoria-55-2026
title: Minciencias Convocatoria 55 - Convocatoria especial para la financiación de macroproyectos nacionales
  para el fortalecimiento de las capacidades científico-tecnológicas del país (SGR CTeI)
funder: Ministerio de Ciencia, Tecnología e Innovación de Colombia (Minciencias) - Sistema General de
  Regalías (SGR)
funder_type: national_agency
program: SGR Asignación CTeI - macroproyectos nacionales multirregionales (bienio 2025-2026)
opportunity_type: consortium_call
themes:
- climate_adaptation
- digital_agriculture
- ai_ml
- climate_data_infrastructure
- food_security
- capacity_building
url: https://minciencias.gov.co/node/9581
source_urls:
