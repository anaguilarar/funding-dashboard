eligible_activities: Research use of SDGSAT-1 10 m multispectral (incl. two red-edge-adjacent bands),
  10 m glimmer (night light) and 30 m thermal infrared data.
required_documents: User registration; proposal form (research information).
application_procedure: Register at https://www.sdgsat.ac.cn/register; click 'proposal submission'; contact
  sdgsat1@cbas.ac.cn if quota is not updated.
eligibility_assessment: confirmed_eligible
scientific_alignment: 4
scientific_alignment_rationale: 30 m TIR is useful for crop water stress/ET and 10 m MS for crop mapping;
  complements Sentinel/Landsat in yield and phenology work.
strategic_relevance: 3
strategic_relevance_rationale: Opens a door to CBAS/CAS collaboration (DBAR/DSP networks) and SDG2/13
  reporting; data, not money.
technical_feasibility: 5
technical_feasibility_rationale: Trivial to apply; data handling within team skills.
recommendation: Register and submit a quota proposal for a Colombia/Honduras crop thermal-stress pilot;
  use it as a basis for a joint CBAS paper or NSFC/ANSO proposal.
potential_partners: CBAS / AIRCAS (Guo Huadong team), DBAR / Digital Sustainability Programme (DSP) network.
next_action: Register on sdgsat.ac.cn and submit a proposal; email sdgsat1@cbas.ac.cn.
