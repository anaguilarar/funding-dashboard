  (e.g., national met service) - low cost, rolling.
potential_partners: KMD (Kenya Meteorological Department), ICPAC, AfriClimate AI, national agricultural
  research institutes.
next_action: Identify an Africa-led pilot-stage tool and submit the EOI form; ask LDRI whether international
  research centres with African offices qualify.
