  status_quote: The ArcX Programme Call for Proposals opens 29 October 2026
  staff_costs_quote: 'The budget categories are: A. Personnel costs; B. Travel, accommodation and subsistence;
    C. Computing; D. Other direct costs; E. Subcontracting; F. Indirect costs.'
