eligible_activities: Global Agricultural Development (smallholder food security programs in developing
  nations); Agricultural Education (research, education, extension on soil health and balanced nutrition);
  Nutrient Stewardship in watersheds.
required_documents: Not specified (online application after invitation).
application_procedure: Email community.relations@mosaicco.com describing an opportunity fitting Food/Water
  focus in India, China or Brazil; if invited, apply via online form by a quarterly deadline.
