technical_feasibility_rationale: Feasible if paired with Alliance India soil/nutrient team; outside researcher's
  core LAC work.
recommendation: Low priority. Pursue only if Alliance India has a soil-health/nutrient-advisory project
  needing co-funding; send an inquiry email before the 21 Dec 2026 round.
potential_partners: Alliance India office; S M Sehgal Foundation (past Mosaic grantee in India)
next_action: Forward to Alliance Asia/India colleagues; if interested, email community.relations@mosaicco.com
  before mid-December 2026.
