status: upcoming
status_basis: official
published_date: Not specified
deadline: 2027-04-08T17:00
deadline_timezone: CET (Brussels local time, 17:00)
deadline_text: 'Opening: 04 Feb 2027; Deadline(s): 08 Apr 2027 (First Stage), 14 Sep 2027 (Second Stage).
  All deadlines are at 17.00.00 Brussels local time.'
funding_amount_min: null
funding_amount_max: 6000000
currency: EUR
funding_text: Expected EU contribution around EUR 6.00 million per project; total indicative topic budget
  EUR 12.00 million (around 2 projects). Research and Innovation Action, lump sum. Financial support to
  third parties allowed (max EUR 60 000 per third party).
duration: Not specified
duration_months_max: null
covers_staff_costs: 'yes'
support_type: project_funding
eligible_applicants: Consortia of legal entities per General Annex B; multi-actor approach mandatory.
eligible_countries: EU Member States, Associated Countries, and (exceptionally) all African Union member
  states; LMIC list per General Annex B.
international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: 'Topic text: ''International organisations with headquarters in a Member State
  or Associated Country are exceptionally eligible for funding.'' Bioversity International (HQ Rome, Italy)
  can therefore be a funded beneficiary and potentially coordinator; CIAT Africa staff can contribute
  via the Bioversity entity. CIAT (HQ Colombia) is not covered by this clause.'
lead_applicant_requirements: Coordinator must be an eligible legal entity; standard Horizon Europe minimum
  (3 independent entities from 3 different EU MS/AC, at least one from a MS) plus at least three independent
  legal entities established in AU member states.
geographic_restrictions: Activities must cover at least two different African agro-ecosystems.
consortium_required: 'yes'
consortium_details: Minimum HE consortium + 'at least three independent legal entities established in
  an African Union member state'. Multi-actor approach with public authorities, advisory services and
  farmer organisations. First stage evaluated blindly (no organisation names in abstract/Part B).
cofunding_required: 'no'
cofunding_details: RIA/CSA funded at 100% of eligible costs (lump sum); not-for-profit legal entities
  get 100% in IAs too. See General Annex G.
eligible_activities: Assess needs/opportunities for water, nutrient and energy management in agriculture;
  develop knowledge, practices and tools for on-farm resource management at the nexus; evaluate water/energy/nutrient
  balances, economic feasibility, climate footprint and social effects; enable circular, climate-smart
  and biodiversity-friendly practices for smallholders; link to AU-EU Innovation Agenda and Horizon Europe
  living labs in Africa.
required_documents: Proposal Part A (admin forms via Funding & Tenders Portal) and Part B (technical description
  per template); ethics self-assessment; lump-sum budget table where lump sum applies. See General Annexes
  A and E.
application_procedure: Electronic submission through the EU Funding & Tenders Portal by the coordinator;
  all participants need a validated PIC.
eligibility_assessment: confirmed_eligible
scientific_alignment: 4
scientific_alignment_rationale: Climate-smart agriculture for African smallholders with tools/DSS; EO,
  crop modelling (water/nutrient balances) and digital advisory fit well, though topic is nexus/practice
  focused rather than RS/AI per se.
strategic_relevance: 5
strategic_relevance_rationale: Explicit AU-EU FNSSA priority, Africa smallholders, IOs funded; core CGIAR/Alliance
  mission and Africa hub presence.
technical_feasibility: 4
technical_feasibility_rationale: Alliance has Africa agronomy, soil/water, crop modelling and digital
  advisory capacity; energy component needs partners.
recommendation: Top priority. One of very few 2027 Cluster 6 topics that explicitly funds IOs headquartered
  in the EU and targets African smallholders. Build a consortium now for the 8 Apr 2027 blind first-stage
  deadline.
potential_partners: African NARS (e.g., KALRO, EIAR, CORAF members), icipe / RMRN Eastern Africa, CORAF
  / UCAD (RMRN Western Africa), European universities (WUR, CIRAD, Univ. of Bonn ZEF), farmer organisations,
  energy/irrigation SMEs.
next_action: Contact Alliance Africa/Climate Action leads and Bioversity grants office; draft concept
  and identify coordinator by Dec 2026; register interest on F&T portal partner search.
