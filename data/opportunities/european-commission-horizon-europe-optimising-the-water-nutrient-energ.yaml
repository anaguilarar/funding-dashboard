title: Optimising the water-nutrient-energy nexus for sustainable and climate smart agriculture in Africa
  (FNSSA) - HORIZON-CL6-2027-02-FARM2FORK-02-two-stage
funder: European Commission (Horizon Europe)
funder_type: multilateral
