international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: Unclear until the NOFO is published (est. Apr 2027). Past GEOHealth rounds (RFA-TW-21-001)
  used a U01 award to an LMIC institution linked to a U2R award to a U.S. institution (per FIC programme
  page), which would suggest CIAT (Colombia-based) could be the LMIC institution - but this could not
  be verified for the new RFA, and NIH's 2025 foreign-subaward policy (NOT-OD-25-104) now uses linked
  foreign awards. Treat as potential funded LMIC partner/lead pending NOFO. Topic must be environmental/occupational
  exposures and health (e.g., heat/pesticide exposure of agricultural workers, wildfire smoke), not agriculture
  per se.
lead_applicant_requirements: Not specified until NOFO.
geographic_restrictions: LMIC focus with U.S. benefit.
consortium_required: 'yes'
consortium_details: '"GEOHealth awards will 1) include collaboration between U.S. and LMIC scientists,
  2) include closely aligned components for research and research training".'
cofunding_required: 'no'
cofunding_details: 'Forecast lists cost sharing: no.'
eligible_activities: Environmental and occupational health research plus research training; address environmental/chemical
  exposures and their health impacts; data sharing; training of graduate students, postdocs and early-career
  investigators.
required_documents: Not specified
application_procedure: Not specified until NOFO (NIH ASSIST/Grants.gov; requires eRA Commons).
eligibility_assessment: potentially_eligible
scientific_alignment: 2
scientific_alignment_rationale: Climate and health is adjacent; EO/climate data for exposure assessment
  (heat, smoke, agro-chemicals) could be a component, but the core must be health research.
strategic_relevance: 2
strategic_relevance_rationale: Multi-year hub format with research training; would require a health-research
  lead partner; outside the Alliance's core mandate.
technical_feasibility: 2
technical_feasibility_rationale: Requires health/epidemiology leadership the team does not have.
recommendation: 'Low priority. Monitor NOFO release (~Apr 2027); pursue only if a Colombian or U.S. health
  research partner wants EO/climate exposure expertise. Alternative NIH route: PA-26-002 (Collaborative
  International Research Project, PF5) allows funded linked foreign awards under a U.S. prime, but also
  requires an NIH health mission focus.'
potential_partners: Universidad del Valle / Universidad de Antioquia public health schools; U.S. schools
  of public health with LAC environmental-health programmes.
next_action: Set a reminder for April 2027 to read the NOFO eligibility section (foreign/LMIC institution
  rules).
