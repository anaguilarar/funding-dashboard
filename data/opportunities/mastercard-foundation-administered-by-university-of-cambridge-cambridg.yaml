status: open
status_basis: official
published_date: '2026-10-15'
deadline: 2027-01-15T23:59
deadline_timezone: Not specified
deadline_text: 'The deadline for submission is 15th January 2027 and applications can be submitted at
  any time before this. Timeline: 15th October 2026 Applications open; 15th January 2027 Applications
  close; March 2027 Application outcomes confirmed.'
funding_amount_min: null
funding_amount_max: 80000
currency: GBP
funding_text: 'Research Catalyst Grant for up to GBP 25,000, a Research Project Grant for up to GBP 80,000
  or a Workshop Grant for up to GBP 50,000. We do not cover salaries of either investigator, institutional
  overheads, indirect costs or grant administration costs. Overall fund: GBP 7.7 million from the Mastercard
  Foundation, 2025-2030.'
duration: Approx. 12 months (Catalyst and Workshop grants) or up to 18 months (Research Project Grant);
  no-cost extensions up to 6 months considered
duration_months_max: 18
covers_staff_costs: 'no'
support_type: project_funding
eligible_applicants: 'Pairs of researchers (post-doctoral level or above; equivalent experience considered):
  one from the University of Cambridge (lead, administers the award) and one from a university or research
  institution of comparable standing on the African continent. Both must be employed at their institutions.'
eligible_countries: 'African partner: any country on the African continent; lead must be University of
  Cambridge'
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: Cannot lead (Cambridge applicant is always lead). The Alliance could be the Africa-based
  partner only via a researcher employed at an Alliance office in Africa (e.g., Nairobi) and only if accepted
  as a 'research institution of comparable standing to a university' - not stated explicitly; confirm
  with africaclimatecollaborative@cambridge-africa.cam.ac.uk. A Cali-based researcher cannot be the African
  applicant. Salaries and overheads not covered.
lead_applicant_requirements: Cambridge-based applicant leads for administrative purposes, registers and
  invites the Africa-based applicant.
geographic_restrictions: Research relevant to climate resilience and sustainability on the African continent;
  equipment must remain with the African institution.
consortium_required: 'yes'
consortium_details: Mandatory Cambridge + African institution pair; true collaboration required. Research
  Project Grants require evidence of prior successful collaboration.
cofunding_required: 'no'
cofunding_details: Not specified
eligible_activities: Seed/catalyst research, larger collaborative research projects, skills workshops
  in Africa; equipment for use in Africa.
required_documents: Case for support; itemised budget; lay summary; letters of support from both departments/institutions;
  CVs; suggested referees.
application_procedure: Online joint application form on the Cambridge-Africa website, started by the Cambridge
  applicant who invites the African applicant.
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: Climate resilience interpreted broadly; accommodates EO/AI crop monitoring,
  yield forecasting, climate-smart agriculture in Africa.
strategic_relevance: 3
strategic_relevance_rationale: Builds a Cambridge partnership and Africa capacity; small amounts, no salary/overhead
  coverage.
technical_feasibility: 4
technical_feasibility_rationale: Seed/workshop formats (e.g., GEE/EO training workshop) easily deliverable.
recommendation: Pursue only if an Africa-based Alliance colleague and a Cambridge counterpart can be lined
  up before mid-December 2026; confirm Alliance eligibility as African institution first.
potential_partners: University of Cambridge (Geography, Plant Sciences, Computer Science/AI for Environmental
  Risks), Alliance Africa hub (Nairobi), Makerere, University of Ghana, UCT
next_action: Email africaclimatecollaborative@cambridge-africa.cam.ac.uk to confirm whether an Alliance
  Africa office qualifies; identify a Cambridge lead in November 2026.
