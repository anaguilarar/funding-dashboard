id: ministerio-de-ciencia-tecnologia-e-innovacion-minciencias-colombia-sis
title: Convocatoria 56 - Convocatoria de emergencia para la recuperación y generación de capacidades transformadoras
  (Decreto 1414 de 2026)
funder: Ministerio de Ciencia, Tecnología e Innovación (MinCiencias), Colombia - Sistema General de Regalías
  (SGR) Asignación CTeI
funder_type: national_agency
program: Plan de convocatorias ASCTeI SGR 2025-2026
opportunity_type: consortium_call
themes:
- climate_adaptation
- climate_smart_ag
- digital_agriculture
- remote_sensing
- ai_ml
- food_security
- smallholders
- multifunctional_landscapes
