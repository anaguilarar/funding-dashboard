status: open
status_basis: official
published_date: Not specified
deadline: 2026-11-30T12:00
deadline_timezone: GMT
deadline_text: The closing date for Concept Notes is 12:00 noon GMT on 30 November 2026.
funding_amount_min: 200000
funding_amount_max: 1500000
currency: GBP
funding_text: Projects with a budget of between £200,000 and £1,500,000; aim to fund a mixed portfolio
  of up to 12 grants.
duration: 2 to 4 years
duration_months_max: 48
covers_staff_costs: 'yes'
support_type: project_funding
eligible_applicants: Led by a Research Organisation. UK-registered leads must be on the UKRI eligible
  list; non-UK leads must demonstrate they are legally constituted, have a research remit and relevant
  research experience. Lead organisations from ODA-eligible countries especially welcome. Private sector
  can be consortium partners but not lead or receive funds for profit.
eligible_countries: Research must focus on OECD DAC (ODA)-eligible countries within the Amazon Basin,
  Congo Basin and Coral Triangle; at least one implementing partner legally registered in an ODA-eligible
  country in a focal geography.
international_orgs_eligible: unclear
cgiar_eligible: 'yes'
cgiar_eligibility_notes: 'FAQ: lead organisations can be based outside the UK, and ''A lead organisation
  may be based outside the ODA country ... in such a case at least one partner organisation must be based
  in the ODA-country.'' CIAT (legally constituted research organization headquartered in Colombia, an
  ODA country with Amazon territory) or Bioversity (Italy) could lead; CIAT Colombia/Peru offices could
  also serve as in-region partner. International-organization status not explicitly addressed; confirm
  with infogcbc@gcbc.org.uk.'
lead_applicant_requirements: Research Organisation, legally constituted, research remit; capable of managing
  the grant budget.
geographic_restrictions: Amazon Basin (east of the Pacific/Atlantic watershed; eastern Andean slopes included;
  Galapagos excluded), Congo Basin, Coral Triangle; DAC-eligible countries only (French Guiana excluded;
  Guyana expected to graduate 2027).
consortium_required: optional
consortium_details: Partnerships expected; at least one implementing partner registered in an ODA-eligible
  country in a focal geography. Organisations may join more than one concept note if projects are distinct.
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: Research on drivers of biodiversity loss (incl. land-use change/agricultural expansion)
  and transformative change linked to climate and poverty in the three regions. Budget lines include staff,
  travel, equipment, sub-contractors, overheads (15% cap, excluding MEL).
required_documents: 'Stage 1: Concept Note with indicative budget (only 10% variance allowed vs full proposal).
  Stage 2 (invited): full proposal.'
application_procedure: 'Two-stage: Concept Note via GCBC application portal (linked from Invitation to
  Apply Overview) by 30 Nov 2026 12:00 GMT; shortlisted applicants invited to full proposal. Clarifying-questions
  deadline (30 Oct) has passed.'
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: Land-use drivers of deforestation/biodiversity loss in the Amazon map
  directly onto EO/remote sensing, landscape modelling and agricultural-frontier work (e.g., cattle/cacao/coffee
  landscapes in Colombian/Peruvian Amazon).
strategic_relevance: 5
strategic_relevance_rationale: Multi-year (up to 4 yrs), staff-eligible (PI up to 100% time), up to £1.5M,
  Amazon focus aligned with Alliance Multifunctional Landscapes and LAC presence; CIAT HQ in an eligible
  ODA country.
technical_feasibility: 4
technical_feasibility_rationale: Alliance has Amazon landscape, deforestation-free value chain and EO
  teams and established Colombian/Peruvian partners; concept note feasible in four weeks.
recommendation: 'Strong candidate: pursue an Amazon-focused concept note (agricultural drivers of biodiversity
  loss, EO monitoring + transformative change pathways) with CIAT as lead or with a national partner lead.'
potential_partners: Instituto SINCHI, Universidad Nacional de Colombia (Amazonía), IIAP Peru, Fundación
  Gaia Amazonas, UK university partners (e.g., Lancaster, Oxford ECI), CIFOR-ICRAF.
next_action: Download Invitation to Apply Overview and Theme Paper; email infogcbc@gcbc.org.uk to confirm
  CIAT eligibility as lead; draft concept note and indicative budget by 30 Nov 2026 12:00 GMT.
evidence:
  deadline_quote: The closing date for Concept Notes is 12:00 noon GMT on 30 November 2026.
