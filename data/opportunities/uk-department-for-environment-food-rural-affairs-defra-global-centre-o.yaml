    research will be conducted. However, in such a case at least one partner organisation must be based
    in the ODA-country.
  status_quote: We are now accepting Concept Notes for Research Grant Competition 4 (RGC4)
  staff_costs_quote: Yes- the PI's salary is an acceptable cost. ... The PI (or any other individual within
    the partnership) can have up to 100% of their time covered- providing this is justified
