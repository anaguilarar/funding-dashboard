id: uk-department-for-environment-food-rural-affairs-defra-global-centre-o
title: Global Centre on Biodiversity for Climate (GCBC) Research Grant Competition 4 (RGC4) - Concept
  Note window (Amazon, Congo Basin, Coral Triangle)
funder: UK Department for Environment, Food & Rural Affairs (Defra) - Global Centre on Biodiversity for
  Climate (UK ICF/ODA)
funder_type: bilateral
program: 'GCBC Research Grant Competition 4 (RGC4): Enabling transformative change - addressing drivers
  of biodiversity loss in three critical regions'
opportunity_type: grant
themes:
