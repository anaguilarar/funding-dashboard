id: axa-foundation-for-human-progress-formerly-axa-research-fund-axa-new-g
title: AXA New Gen 2026 Postdoctoral Fellowship - Responsible Nature-Based Solutions for a Resilient,
  Sustainable and Inclusive Future
funder: AXA Foundation for Human Progress (formerly AXA Research Fund)
funder_type: foundation
program: AXA New Gen (Science pillar) - 2026 call on Responsible Nature-Based Solutions
opportunity_type: fellowship
themes:
- climate_adaptation
- multifunctional_landscapes
- food_security
- biodiversity
- climate_smart_ag
url: https://institution.axa-research.org
source_urls:
