status: open
status_basis: official
published_date: '2026-10-20'
deadline: 2026-11-12T16:00
deadline_timezone: CET
deadline_text: 'Step 1: Expression of Interest: October 20 - November 12, 2026 (4 PM CET). Institutions
  not yet registered in the platform must register by November 3, 2026 (4 PM CET) to submit EOI. Step
  2: Full application (for shortlisted candidates only): November 24 - December 17, 2026 (4 PM CET)'
funding_amount_min: null
funding_amount_max: 140000
currency: EUR
funding_text: 'The AXA New Gen is awarded for a maximum amount of 140,000EUR in total, to be spent over
  two years. ... The budget will help cover: Annual salary of the researcher (based on institution internal
  policy); Equipment/resources (databases, survey costs, consumables, etc.); Academic activities (conferences,
  workshops, fieldwork, etc.); Outreach activities (beyond academic audiences). ... Overhead costs are
  NOT eligible.'
duration: 2 years ('An AXA New Gen Fellowship is awarded for a period of 2 years.'); projects expected
  to start before June 2028
duration_months_max: 24
covers_staff_costs: partial
support_type: fellowship_salary
eligible_applicants: 'Host institution applies on behalf of ONE early-career candidate per institution.
  Hosts: academic institutions (registered in WHED) and public research organizations. Candidate: PhD
  defended within the last 5 years before 10 Oct 2026 (+6 months per child), no permanent (tenured/tenure-track)
  position, full-time on the project.'
eligible_countries: Global ('The project calls are global.')
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: 'Hosts must be universities or public research organizations; ''Associations,
  foundations, governmental bodies, hospitals, independent research centers, museums, and NGOs are not
  eligible for AXA funding.'' The Alliance/CIAT is an international (treaty-based) research organization
  - not clearly a ''public research organization'' and possibly read as an ''independent research center''.
  Must be confirmed with science.foundation@axa.com before 3 Nov 2026 registration deadline. Safer route:
  the candidate is hosted by a partner university (e.g., a Colombian or European university) with the
  Alliance as a societal/non-academic partner. Also note the fellowship is for the candidate''s own salary
  - the candidate must meet PhD+5 and no permanent position rules.'
lead_applicant_requirements: 'Institution''s Operational Contact submits EOI in English: candidate details
  (date of birth, PhD defense date), short CV (max 2 pages), research project description (max 3,000 characters).
  Researcher must hold PhD for no more than 5 years and not hold a permanent position.'
geographic_restrictions: None stated (global call).
consortium_required: 'yes'
consortium_details: 'Project must include at least one transdisciplinary aspect: (i) collaboration across
  disciplines (social sciences/humanities/economics AND natural/environmental sciences/engineering/technology)
  and (ii) societal partners (public authorities, communities, civil society organizations, practitioners).
  Private for-profit companies are not eligible as project partners.'
cofunding_required: 'no'
cofunding_details: '''Host institutions will be expected to participate in the AXA New Gen''s general
  funding with studentships, PhD support, and material resources ... There is no minimum requirement for
  the institution''s contribution. However, a larger contribution makes the proposal more attractive.'''
eligible_activities: 'Postdoctoral research on nature-based solutions: disaster risk reduction and adaptation;
  food and water security under climate stress (''NbS for sustainable agriculture, forest and landscape
  restoration, and water resources management''); urban green infrastructure; health/cultural dimensions;
  economic models and financing of NbS; governance and social justice.'
required_documents: 'EOI: candidate details, 2-page CV, 3,000-character project description. Full application
  (shortlisted): detailed research program, CV and publication list, letters of support (supervisor at
  host institution and an academic and/or non-academic partner), budget incl. host contribution.'
application_procedure: Host institution registers on https://institution.axa-research.org (by 3 Nov 2026),
  Operational Contact submits EOI by 12 Nov 2026 16:00 CET; shortlisted full application 24 Nov - 17 Dec
  2026; rebuttal 30 Mar - 5 Apr 2027; results June 2027.
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: NbS for agriculture/landscape restoration and food security under climate
  stress fits Multifunctional Landscapes; RS/EO and crop modelling can quantify NbS trade-offs, but a
  social-science component is mandatory.
strategic_relevance: 4
strategic_relevance_rationale: Directly matches Alliance Multifunctional Landscapes/climate action agenda;
  global call; prestigious early-career salary support.
technical_feasibility: 3
technical_feasibility_rationale: Feasible technically; binding constraints are the candidate profile (PhD+5,
  non-permanent), the host-institution eligibility question and the very short EOI window.
recommendation: Pursue only if (a) the researcher (or a junior Alliance postdoc) defended the PhD after
  ~Oct 2021 and has no permanent post, and (b) AXA confirms the Alliance can host, or a partner university
  agrees to host. Only one candidate per institution - coordinate early.
potential_partners: Colombian universities (e.g., Universidad Nacional de Colombia, Universidad del Valle,
  Universidad de los Andes) as host; local governments/community organizations as societal partners.
next_action: Email science.foundation@axa.com this week asking whether the Alliance of Bioversity International
  and CIAT (international research organization) qualifies as a host; in parallel identify a university
  host and check its Operational Contact registration before 3 Nov 2026.
