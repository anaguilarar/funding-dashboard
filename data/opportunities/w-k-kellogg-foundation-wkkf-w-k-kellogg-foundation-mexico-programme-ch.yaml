eligible_applicants: Organizations whose work fits WKKF priorities; "We are unable to make grants for
  individuals, capital investments, political parties or candidates." No formal eligibility list on the
  grantseekers page.
eligible_countries: 'USA; Mexico (25 municipalities in Chiapas Highlands and inner Yucatan Peninsula:
  Yucatan, Campeche, Quintana Roo); Haiti (central and southwest).'
international_orgs_eligible: unclear
cgiar_eligible: unclear
cgiar_eligibility_notes: 'Official pages do not restrict applicant nationality or legal form, but grants
  are place-based and community-led in 25 specific municipalities. Secondary sources report a WKKF-UNDP
  Mexico partnership in 40 southeastern communities (UNDP page returned 403, unverified), suggesting international
  organizations can be grantees. Most realistic route: Alliance as technical partner to a local community
  organization or to the locally managed Agroecology Fund of the Yucatan Peninsula, or a direct LOI for
  a co-designed project; confirm with the WKKF Concierge Desk whether CIAT/Bioversity can be direct grantees.'
lead_applicant_requirements: Register in WKKF's Fluxx system and submit a Letter of Inquiry; formal proposal
  only by invitation.
geographic_restrictions: Mexico grantmaking concentrated on 25 municipalities in Chiapas Highlands and
  inner Yucatan Peninsula.
consortium_required: optional
consortium_details: Not required; strong emphasis on community-led, Indigenous-knowledge-based partnerships.
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: 'Food systems: "We are supporting communities to secure access to seed, land and
  water to advance food sovereignty and enhance adaptation, as well as helping get healthy, locally produced
  food into schools and local and regional markets." Agroecology: "We are committed to supporting agroecology
  as a movement that recognizes Indigenous knowledge". Economic security: agriculture, especially coffee,
  honey, milpa, backyard gardens, animal husbandry. Also community water management.'
required_documents: Letter of Inquiry (short, high-level description) via Fluxx; full proposal if invited.
application_procedure: 'Register in Fluxx -> submit LOI (instructions in English, Spanish, Haitian Creole)
  -> WKKF responds within ~30 business days -> invited proposals reviewed in ~60 business days. Questions:
  conciergedesk@wkkf.org.'
eligibility_assessment: potentially_eligible
scientific_alignment: 2
scientific_alignment_rationale: Climate adaptation of milpa/coffee/honey systems, agrobiodiversity and
  water access are relevant, but WKKF funds community-led action and equity outcomes; RS/AI/crop modelling
  would only be a supporting component (e.g., participatory climate-risk maps, milpa suitability).
strategic_relevance: 3
strategic_relevance_rationale: Large foundation with multi-year, place-based commitments in Mexico; Alliance
  has milpa/agrobiodiversity and coffee-climate expertise in Mesoamerica; but narrow geography and community-led
  ethos limit research-staff funding.
technical_feasibility: 3
technical_feasibility_rationale: Feasible only with established local community partners in Yucatan/Chiapas.
recommendation: Only funder among those checked with an always-open official application route touching
  LAC climate adaptation. Pursue only if a Yucatan/Chiapas community partner can lead; frame the Alliance
  role as climate-risk/agrobiodiversity science service to community food sovereignty. Do not expect it
  to fund an EO/AI research agenda.
potential_partners: Agroecology Fund of the Yucatan Peninsula; UNDP Mexico (reported WKKF partner); local
  milpa/apiculture/coffee cooperatives; ECOSUR; Alliance Mesoamerica agrobiodiversity team
next_action: Email conciergedesk@wkkf.org asking whether an international organization (CIAT/Bioversity)
  can be a direct grantee in the Mexico programme and whether staff costs are allowable; in parallel identify
  a Yucatan community partner to co-author a Fluxx LOI.
