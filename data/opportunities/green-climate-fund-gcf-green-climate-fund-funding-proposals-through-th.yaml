international_orgs_eligible: 'yes'
cgiar_eligible: 'yes'
cgiar_eligibility_notes: 'Re-verified 2026-11-02: ''CGIAR System Organization (CGIAR)'' remains Accredited
  (approved 19 Oct 2018; AMA executed 21 Sep 2022, effective 30 Sep 2022; term end/renewal 29 Sep 2027;
  re-accreditation submission deadline 29 Mar 2027). One project listed: FP304 LARACI (Cote d''Ivoire),
  ''Under implementation''. No individual CGIAR center is separately accredited. Route for the Alliance:
  co-develop with an NDA and submit through the CGIAR System Organization (Small, Category C, grant-award
  scope only), or serve as executing/technical partner of another AE (FAO, IFAD, UNDP, WFP, CAF, CABEI,
  IDB, national DAEs). Key risk: accreditation term ends 29 Sep 2027 unless re-accreditation is submitted
  by 29 Mar 2027.'
lead_applicant_requirements: Accredited entity (CGIAR System Organization) as lead; NDA no-objection;
  project must fit the AE's accreditation scope (Small, Category C, grant award).
geographic_restrictions: GCF-eligible developing countries.
consortium_required: 'yes'
consortium_details: Accredited entity + NDA (country ownership) + executing entities (CGIAR centers, national
  institutions).
cofunding_required: Not specified
cofunding_details: Not specified
eligible_activities: Climate adaptation and mitigation projects in GCF result areas (e.g., food and water
  security, livelihoods, ecosystems, forests and land use).
required_documents: 'Standard GCF concept note / funding proposal package (FP304 documents on the AE page:
  concept note, funding proposal, gender assessment, gender action plan).'
application_procedure: Engage the CGIAR System Organization GCF focal point and the target country's NDA;
  submit concept note via the GCF Partner Portal through the AE; optionally request Project Preparation
  Facility support.
eligibility_assessment: potentially_eligible
scientific_alignment: 4
scientific_alignment_rationale: Climate-resilient agri-food systems and land management (cf. FP304) use
  climate risk analytics, EO monitoring and crop modelling directly; methods are components rather than
  the main output.
strategic_relevance: 5
strategic_relevance_rationale: Only verified direct route from CGIAR to GCF; large-scale, country-owned
  adaptation programmes in LAC/Africa/Asia fit the Alliance mission.
technical_feasibility: 3
technical_feasibility_rationale: Alliance can deliver climate-information/EO/advisory components, but
  GCF project development takes 1-3 years, needs NDA buy-in and System-level coordination; accreditation
  renewal due Sep 2027.
recommendation: Pursue as a medium-term pipeline; first confirm with the CGIAR System Organization that
  re-accreditation will be submitted by 29 Mar 2027, otherwise plan via another AE (FAO/IFAD/WFP/CAF).
potential_partners: CGIAR System Organization (AE); NDAs; national meteorological services; FAO/IFAD/WFP
  as alternative AEs; CIFOR-ICRAF (FP304 experience).
next_action: Contact the CGIAR System Organization GCF focal point about re-accreditation plans and the
  internal pipeline; shortlist 1-2 countries with NDAs open to a CGIAR-led concept.
