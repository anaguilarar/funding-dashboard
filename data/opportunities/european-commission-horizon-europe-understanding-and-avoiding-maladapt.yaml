cgiar_eligibility_notes: Bioversity International (registered in Italy) can join as a funded beneficiary;
  Horizon Europe personnel costs are eligible actual costs. CIAT (Colombia) is not automatically eligible
  for funding (Colombia not on LMIC list), so run any Colombian/LAC case-study work through Bioversity
  or as associated partner.
lead_applicant_requirements: Not specified beyond Horizon Europe standard rules
geographic_restrictions: Topic is EU-policy oriented (EU Adaptation Strategy, Climate-ADAPT), but scope
  explicitly covers evidence 'across sectors and regions, both in Europe and globally'
consortium_required: 'yes'
consortium_details: Standard Horizon Europe RIA consortium; coordination with Mission Adaptation and Cluster
  5 Destination 1 projects encouraged
cofunding_required: 'no'
cofunding_details: RIA funded at 100% of eligible costs (Horizon Europe standard)
eligible_activities: Identify drivers of maladaptation across systems; map/validate evidence via case
  studies (local/regional/national); strengthen methodological toolbox for complex climate risk and adaptation
  assessment; propose corrective responses and prevention guidelines; feed EU repositories (Climate-ADAPT)
  and European Climate Risk Assessments. If satellite EO is used, Copernicus and/or Galileo/EGNOS must
  be used.
required_documents: Horizon Europe Part A (online forms) and Part B (technical description) via F&T Submission
  System
application_procedure: Single-stage submission through the EU Funding & Tenders Portal
eligibility_assessment: confirmed_eligible
scientific_alignment: 3
scientific_alignment_rationale: Adaptation evidence and risk-assessment methods are core; Alliance crop-model/EO
  evidence on maladaptation in agriculture (e.g., irrigation, land-use shifts, crop switching) fits a
  case-study work package, but topic is SSH/policy heavy rather than RS/AI-centric.
strategic_relevance: 4
strategic_relevance_rationale: Global evidence on agricultural maladaptation from LAC/Africa/Asia is a
  distinctive CGIAR contribution; IPCC-relevant.
technical_feasibility: 4
technical_feasibility_rationale: Team can deliver crop-modelling and remote-sensing based adaptation outcome
  assessments as case studies.
recommendation: Pursue as partner (Bioversity Italy as beneficiary) in a European consortium; offer global
  agri-food case studies on maladaptation detected via EO + crop modelling. Opens 17 Nov 2026, deadline
  4 Mar 2027 - start partner search now.
potential_partners: Climate-ADAPT/EEA-linked institutes, PIK, CMCC (Italy), IIASA, Wageningen UR, BC3,
  SEI
next_action: Register topic in F&T partner search after 17 Nov 2026 opening; contact CMCC/PIK/WUR adaptation
  groups proposing a global agriculture maladaptation case-study WP.
